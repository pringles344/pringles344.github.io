title: Game Design Portfolio
description: University game design work and portfolio projects
url: "https://pringles344.github.io"

# Theme for the portfolio landing page
# Try others if you want a different look:
# - jekyll-theme-slate
# - jekyll-theme-cayman
# - jekyll-theme-time-machine
# - jekyll-theme-minimal

theme: jekyll-theme-minimal

# Optional collections for future project pages
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Default front matter for project pages
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Author info
author:
  name: Your Name
  email: your.email@example.com

# jekyll plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
